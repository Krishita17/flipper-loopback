id: subghz_silence_433_92
subsystem: subghz
description: >
  NEGATIVE. Listen on 433.92 MHz for 5 s with nothing transmitted; any decode fails.
  Catches ghost decodes, but also picks up real neighbours (weather stations, doorbells),
  so it is tagged `environment` and excluded by default. Run it on purpose to check that
  your bench is quiet: FLCI_TAGS=environment.
stimulus: { kind: silence, frequency_hz: 433920000, listen_s: 5 }
expect_no_decode: true
tags: [negative, environment]
