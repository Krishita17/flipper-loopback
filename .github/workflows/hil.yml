# Hardware-in-the-loop suite on a SELF-HOSTED bench runner (two Flippers on USB).
#
# Runner setup: docs/CI.md. The runner must have the labels [self-hosted, flipper-hil]
# and these repository/environment variables set:
#   FLCI_DUT, FLCI_EMITTER   port paths or device names
#   FLCI_CAPABILITIES        what this bench is wired for, e.g. "subghz,infrared,rfid,nfc,gpio"
#
# SECURITY: never run untrusted code on a self-hosted runner. Fork PRs are excluded below;
# maintainers can run a fork's branch manually via workflow_dispatch after reviewing it.
name: HIL

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      firmware_url:
        description: "Optional URL of a firmware update .tgz to flash onto the DUT first"
        required: false
      tags:
        description: "Optional fixture tags to run (comma list, e.g. smoke)"
        required: false
      soak_runs:
        description: "Optional: also soak every fixture N times to measure flakiness"
        required: false
  # Lets a firmware repo call this bench after it builds an update package.
  workflow_call:
    inputs:
      firmware_artifact:
        description: "Name of an uploaded artifact containing an f7-update-* package"
        type: string
        required: false
      tags:
        type: string
        required: false

concurrency:
  group: flipper-hil-bench # one physical bench, one job at a time
  cancel-in-progress: false

permissions:
  actions: read # download the last main run's results as the regression baseline
  contents: read
  checks: write
  pull-requests: write

jobs:
  hil:
    # Only once a bench is configured (FLCI_DUT set), so no job sits queued forever.
    # Then: same-repo PRs with the "hil" label, pushes to main, or manual/called runs.
    if: >-
      vars.FLCI_DUT != '' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'hil')))
    runs-on: [self-hosted, flipper-hil]
    timeout-minutes: 45
    env:
      FLCI_DUT: ${{ vars.FLCI_DUT }}
      FLCI_EMITTER: ${{ vars.FLCI_EMITTER }}
      FLCI_CAPABILITIES: ${{ vars.FLCI_CAPABILITIES }}
      FLCI_TAGS: ${{ inputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Python env
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'

      - name: Detect bench
        run: .venv/bin/flci detect

      - name: Fetch firmware (URL)
        if: inputs.firmware_url != ''
        env:
          FW_URL: ${{ inputs.firmware_url }}
        run: |
          mkdir -p fw && curl -fsSL "$FW_URL" -o fw/update.tgz

      - name: Fetch firmware (artifact)
        if: inputs.firmware_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.firmware_artifact }}
          path: fw

      - name: Flash DUT
        if: inputs.firmware_url != '' || inputs.firmware_artifact != ''
        run: |
          pkg=$(ls -d fw/*.tgz fw/f7-update-* 2>/dev/null | head -n1)
          .venv/bin/flci flash "$pkg"

      - name: HIL suite
        run: .venv/bin/pytest -m hardware -v -rs --junitxml=reports/hil-junit.xml

      - name: Job summary
        if: always()
        run: |
          [ -f reports/hil-junit.xml ] || exit 0
          .venv/bin/flci report reports/hil-junit.xml >> "$GITHUB_STEP_SUMMARY"

      # Regression gate: compare against the most recent successful HIL run on main.
      - name: Fetch baseline
        id: baseline
        if: always() && github.ref != 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow hil.yml --branch main \
                     --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run_id" ] || { echo "no baseline yet"; exit 0; }
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n hil-junit -D baseline
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Compare with baseline
        if: always() && steps.baseline.outputs.found == 'true'
        run: |
          set -o pipefail
          .venv/bin/flci compare baseline/hil-junit.xml reports/hil-junit.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Soak (flakiness)
        if: inputs.soak_runs != ''
        env:
          RUNS: ${{ inputs.soak_runs }}
        run: |
          .venv/bin/flci soak --runs "$RUNS" --json reports/soak.json --markdown reports/soak.md || true
          cat reports/soak.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results as a check
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: reports/hil-junit.xml
          check_name: HIL results
          include_passed: true
          detailed_summary: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-junit
          path: reports/
