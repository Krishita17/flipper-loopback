name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: black --check .
      - run: mypy
      # Hardware tests skip here (no Flippers on hosted runners); the HIL job is Phase 3.
      - run: pytest -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python-version }}
          path: reports/junit.xml

  jig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q openscad
      - name: Render STL for both jig modes
        run: |
          mkdir -p stl
          for mode in back_to_back head_to_head; do
            openscad -D "mode=\"$mode\"" -o "stl/flipper_jig_$mode.stl" hardware/jig/flipper_jig.scad
          done
          ls -l stl
      - uses: actions/upload-artifact@v4
        with:
          name: jig-stl
          path: stl/
